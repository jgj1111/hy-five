<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15기 참여기업 지도</title>
<script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=o77focq9y6"></script>
<style>
  :root{
    --bg:#f4f6f7;
    --surface:#ffffff;
    --surface-2:#eef1f2;
    --border:#dde3e6;
    --text:#1a2327;
    --text-muted:#5c6c73;
    --accent:#1c7c74;
    --seoul:#2b6cb5;
    --gyeonggi:#1c8c7b;
    --chungnam:#c2622a;
    --chungbuk:#7c5cbf;
    --shadow: 0 1px 2px rgba(20,30,32,.06), 0 8px 24px rgba(20,30,32,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    padding:20px 20px 32px;
  }
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:4px;}
  h1{font-size:26px;font-weight:900;letter-spacing:-0.02em;margin:0 0 4px;}
  .subtitle{color:var(--text-muted);font-size:14px;margin:0;max-width:60ch;}
  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--text-muted);white-space:nowrap;}
  .stat-chip b{color:var(--text);font-weight:700;}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  .map-panel{position:relative;}
  #map{width:100%;height:640px;}
  .legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);z-index:5;}
  .legend-row{display:flex;align-items:center;gap:7px;color:var(--text-muted);}
  .legend-row b{color:var(--text);font-weight:600;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;}
  .sidebar{max-height:640px;overflow-y:auto;padding:6px;}
  .region-group{margin-bottom:2px;}
  .region-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:8px;padding:10px 10px 6px;font-size:12.5px;font-weight:700;color:var(--text-muted);letter-spacing:.02em;}
  .region-head .dot{width:8px;height:8px;}
  .company-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;}
  .company-item:hover,.company-item.active{background:var(--surface-2);}
  .company-item .dot{margin-top:5px;}
  .company-name{font-size:13.5px;font-weight:700;}
  .company-addr{font-size:12px;color:var(--text-muted);margin-top:1px;}
  footer{color:var(--text-muted);font-size:11.5px;line-height:1.6;padding:2px 4px;}
  .iw{
    font-family:inherit;
    display:inline-block;
    width:max-content;
    max-width:220px;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:break-word;
    background:#1a2327;
    color:#ffffff;
    padding:9px 12px;
    border-radius:8px;
    font-size:12.5px;
    line-height:1.5;
    box-shadow:0 4px 16px rgba(0,0,0,.28);
  }
  .iw b{display:block;font-size:13.5px;margin-bottom:2px;color:#ffffff;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>15기 참여기업 위치 지도</h1>
      <p class="subtitle">청년 Hy-Five 15기 참여기업 중 지정된 23개사의 사업장 위치입니다. 마커나 목록을 클릭하면 상세 정보가 표시됩니다.</p>
    </div>
    <div class="stats">
      <span class="stat-chip">참여기업 <b>23</b>개사</span>
      <span class="stat-chip">경기 <b>13</b> · 서울 <b>6</b> · 충북 <b>3</b> · 충남 <b>1</b></span>
    </div>
  </header>

  <div class="layout">
    <div class="panel map-panel">
      <div id="map"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel sidebar" id="sidebar"></div>
  </div>

  <footer>
    위치는 각 기업의 공개된 사업장 주소를 기준으로 한 근사 위치이며, 실제 등기상 본사 주소와 다소 차이가 있을 수 있습니다.
  </footer>
</div>

<script>
const COMPANIES = [{"name": "광건티앤씨", "addr": "서울 광진구 아차산로 319", "region": "서울", "lat": 37.5548057, "lon": 127.1122994}, {"name": "디아이티", "addr": "경기 화성시 정남면 가장로 355-50", "region": "경기", "lat": 37.1620737, "lon": 127.01782}, {"name": "디에프텍", "addr": "충북 청주시 흥덕구 대신로146번길 150", "region": "충북", "lat": 36.6459346, "lon": 127.4416066}, {"name": "디에스테크노", "addr": "경기도 이천시 마장면 마도로 70-81", "region": "경기", "lat": 37.2777954, "lon": 127.3486355}, {"name": "마이크로투나노", "addr": "경기도 용인시 처인구 덕성산단2로50번길 43", "region": "경기", "lat": 37.1728739, "lon": 127.2099628}, {"name": "세보엠이씨", "addr": "서울특별시 서초구 효령로 341", "region": "서울", "lat": 37.480383, "lon": 126.9942574}, {"name": "신성이엔지", "addr": "경기 과천시 과천대로7길 20", "region": "경기", "lat": 37.4139271, "lon": 126.978573}, {"name": "에스비테크", "addr": "충청북도 음성군 금왕읍 금일로 638", "region": "충북", "lat": 36.9862352, "lon": 127.5716381}, {"name": "아이셋디에이", "addr": "경기도 성남시 분당구 판교역로 230", "region": "경기", "lat": 37.3992504, "lon": 127.1096832}, {"name": "엘에스이", "addr": "경기도 용인시 기흥구 기흥로 58-1", "region": "경기", "lat": 37.2825577, "lon": 127.1154434}, {"name": "엠티에스코퍼레이션", "addr": "경기 이천시 부발읍 경충대로 2088", "region": "경기", "lat": 37.2458935, "lon": 127.4928378}, {"name": "유정시스템", "addr": "서울 구로구 디지털로26길 110", "region": "서울", "lat": 37.4808417, "lon": 126.8960219}, {"name": "위드텍", "addr": "경기도 화성시 동탄산단10길 38", "region": "경기", "lat": 37.1796543, "lon": 127.0929951}, {"name": "케이씨이앤씨", "addr": "서울특별시 강남구 테헤란로103길 5", "region": "서울", "lat": 37.5098147, "lon": 127.0638788}, {"name": "코미코", "addr": "경기 안성시 공단2로 23", "region": "경기", "lat": 37.0173252, "lon": 127.2522462}, {"name": "티에스이", "addr": "충남 천안시 서북구 직산읍 군수1길 189", "region": "충남", "lat": 36.8996675, "lon": 127.148872}, {"name": "티이엠씨씨엔에스", "addr": "경기도 안성시 양성면 동항공단길 49", "region": "경기", "lat": 37.06525, "lon": 127.18806}, {"name": "퓨처젠", "addr": "서울시 구로구 디지털로31길 38-21", "region": "서울", "lat": 37.4860453, "lon": 126.8922462}, {"name": "피에스케이홀딩스", "addr": "경기 성남시 수정구 금토로 75", "region": "경기", "lat": 37.4085852, "lon": 127.0674873}, {"name": "한솔아이원스", "addr": "경기도 안성시 고삼면 안성대로 2061", "region": "경기", "lat": 37.0801532, "lon": 127.2593315}, {"name": "에스엠씨엔지니어링", "addr": "충청북도 청주시 흥덕구 가경동 1680", "region": "충북", "lat": 36.6200658, "lon": 127.4341467}, {"name": "대덕전자", "addr": "경기도 안산시 단원구 강촌로 230", "region": "경기", "lat": 37.3181981, "lon": 126.7577806}, {"name": "케이엔솔", "addr": "서울시 강남구 광평로51길 6-23", "region": "서울", "lat": 37.4900792, "lon": 127.1014586}];

const REGION_COLOR = {
  "서울": "#2b6cb5",
  "경기": "#1c8c7b",
  "충남": "#c2622a",
  "충북": "#7c5cbf"
};
const REGION_ORDER = ["서울","경기","충남","충북"];

function pinIcon(color){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 0C5.8 0 0 5.8 0 13c0 9.5 13 21 13 21s13-11.5 13-21C26 5.8 20.2 0 13 0z" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="13" cy="13" r="5" fill="#ffffff"/>
  </svg>`;
  return {
    content: svg,
    size: new naver.maps.Size(26,34),
    anchor: new naver.maps.Point(13,34)
  };
}

const map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.15, 127.05),
  zoom: 9,
  minZoom: 7,
  zoomControl: true,
  zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT }
});

const infoWindow = new naver.maps.InfoWindow({
  content: '',
  borderWidth: 0,
  backgroundColor: 'transparent',
  disableAnchor: true,
  pixelOffset: new naver.maps.Point(0, -8)
});

const markers = {};

COMPANIES.forEach(c => {
  const pos = new naver.maps.LatLng(c.lat, c.lon);
  const marker = new naver.maps.Marker({
    position: pos,
    map: map,
    icon: pinIcon(REGION_COLOR[c.region]),
    title: c.name
  });
  markers[c.name] = marker;

  naver.maps.Event.addListener(marker, 'click', () => focusCompany(c));
});

function focusCompany(c){
  const pos = new naver.maps.LatLng(c.lat, c.lon);
  map.morph(pos, Math.max(map.getZoom(), 14));
  infoWindow.setContent(`<div class="iw"><b>${c.name}</b>${c.addr}</div>`);
  infoWindow.open(map, markers[c.name]);
  setActive(c.name);
}

function setActive(name){
  document.querySelectorAll(".company-item").forEach(el=>{
    el.classList.toggle("active", el.dataset.name === name);
  });
}

// Legend
const legend = document.getElementById("legend");
const counts = {};
COMPANIES.forEach(c => counts[c.region] = (counts[c.region]||0)+1);
legend.innerHTML = REGION_ORDER.map(r =>
  `<div class="legend-row"><span class="dot" style="background:${REGION_COLOR[r]}"></span><b>${r}</b> ${counts[r]||0}개사</div>`
).join("");

// Sidebar
const sidebar = document.getElementById("sidebar");
let html = "";
REGION_ORDER.forEach(region => {
  const items = COMPANIES.filter(c => c.region === region);
  if(!items.length) return;
  html += `<div class="region-group"><div class="region-head"><span class="dot" style="background:${REGION_COLOR[region]}"></span>${region} · ${items.length}개사</div>`;
  items.forEach(c => {
    html += `<div class="company-item" data-name="${c.name}">
      <span class="dot" style="background:${REGION_COLOR[c.region]}"></span>
      <div><div class="company-name">${c.name}</div><div class="company-addr">${c.addr}</div></div>
    </div>`;
  });
  html += `</div>`;
});
sidebar.innerHTML = html;

sidebar.querySelectorAll(".company-item").forEach(el => {
  el.addEventListener("click", () => {
    const d = COMPANIES.find(c => c.name === el.dataset.name);
    if(d) focusCompany(d);
  });
});
</script>
</body>
</html>
